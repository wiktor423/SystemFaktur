# Całe środowisko jedną komendą: `docker compose up`.
#
# Kolejność jest wymuszona warunkami `depends_on`: baza musi być zdrowa, zanim
# ruszą migracje, a migracje muszą się zakończyć, zanim wstanie aplikacja.
# Ten porządek nie jest kosmetyką — aplikacja startująca na nieaktualnym
# schemacie wywraca się na pierwszym zapytaniu.

services:
  db:
    image: postgres:17-alpine
    container_name: lexalpha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexalpha
      POSTGRES_PASSWORD: lexalpha
      POSTGRES_DB: lexalpha
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexalpha -d lexalpha"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    # Obraz budowany zawsze ze źródeł. Bez tego `docker compose up` używa
    # obrazu leżącego na dysku, choćby kod zmienił się od jego zbudowania —
    # a wtedy seed uderza w schemat, którego jeszcze nie ma.
    pull_policy: build
    environment:
      # Wewnątrz sieci Dockera baza nazywa się `db`, nie `localhost`.
      DATABASE_URL: postgresql://lexalpha:lexalpha@db:5432/lexalpha?schema=public&connection_limit=5
      # Dane demonstracyjne przy pierwszym starcie. Seed jest idempotentny
      # (czyści i zakłada od nowa), więc powtórny start nie tworzy duplikatów.
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    pull_policy: build
    container_name: lexalpha-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lexalpha:lexalpha@db:5432/lexalpha?schema=public&connection_limit=5
      # Sekrety KSeF wchodzą ze środowiska hosta — nigdy nie są wpisane tutaj
      # ani wbudowane w obraz. Brak tokenu oznacza pracę na adapterze mock.
      KSEF_CLIENT: ${KSEF_CLIENT:-mock}
      KSEF_BASE_URL: ${KSEF_BASE_URL:-https://api-test.ksef.mf.gov.pl/api/v2}
      KSEF_NIP: ${KSEF_NIP:-}
      KSEF_TOKEN: ${KSEF_TOKEN:-}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Warsaw}
      KSEF_SCHEDULER: ${KSEF_SCHEDULER:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
