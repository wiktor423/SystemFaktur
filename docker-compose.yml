# Baza dla środowiska deweloperskiego. Docelowo dojdzie tu usługa `app`,
# żeby całość wstawała jednym `docker compose up`.
services:
  db:
    image: postgres:17-alpine
    container_name: lexalpha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexalpha
      POSTGRES_PASSWORD: lexalpha
      POSTGRES_DB: lexalpha
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexalpha -d lexalpha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
